version: '3'
services:
  db:
    image: postgres:15.1-alpine
    container_name: db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ave
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    container_name: redis
    image: redis
    ports:
      - '6390:6379'
    command: >
      --requirepass redis12345
    

volumes:
  redis_data: {}